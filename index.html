<style>
:root{--bg:#f3f5f1;--card:#fff;--ink:#12262d;--mute:#5d6f75;--line:#d5dcd8;--pri:#0e2a33;--acc:#ff6a1f;--ok:#1d7a4d;--bad:#c23030;--warn:#b7791f;--priInk:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1a20;--card:#12262d;--ink:#eef3f0;--mute:#93a6ac;--line:#243d46;--pri:#06141a;--ok:#4cc38a;--bad:#ff7b7b;--warn:#f0b955}}
:root[data-theme="dark"]{--bg:#0a1a20;--card:#12262d;--ink:#eef3f0;--mute:#93a6ac;--line:#243d46;--pri:#06141a;--ok:#4cc38a;--bad:#ff7b7b;--warn:#f0b955}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Barlow,system-ui,sans-serif}
.hd{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--pri);color:#fff}.hd img{width:48px;height:48px;border-radius:10px}.hd b{font:700 24px 'Barlow Condensed',sans-serif}
main{padding:12px 12px 84px;max-width:640px;margin:0 auto}
h2{font:700 22px 'Barlow Condensed',sans-serif;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mute);margin:8px 0 2px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:8px;padding:10px;min-height:44px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font:600 16px Barlow,sans-serif;border:0;border-radius:8px;min-height:44px;padding:0 14px;background:var(--pri);color:#fff;cursor:pointer}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--pri);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border-radius:0;min-height:56px;font-size:13px;color:#9fb5bb}
nav button[aria-current="true"]{color:#fff;box-shadow:inset 0 3px 0 var(--acc)}
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;gap:6px}
.score b{font:700 64px/1 'Barlow Condensed',sans-serif}
.score span{font-size:14px;color:var(--mute)}
.clock{font:700 clamp(84px,28vw,150px)/1 'Barlow Condensed',sans-serif;text-align:center;font-variant-numeric:tabular-nums;margin:6px 0}
.clock.end{color:var(--bad)}
.q{text-align:center;font:600 20px 'Barlow Condensed',sans-serif;color:var(--mute)}
#go{width:100%;min-height:120px;font:700 44px 'Barlow Condensed',sans-serif;background:var(--ok);color:#fff;border-radius:14px;margin:8px 0}
#go.run{background:var(--acc)}
.row{display:grid;grid-template-columns:46px 1fr 58px 34px 34px 34px;gap:4px;align-items:center;margin-bottom:4px}
.row input{padding:8px 6px;min-height:40px}
.row.staff{grid-template-columns:100px 1fr 80px}
.row .t{font-size:12px;color:var(--mute);text-align:center}
.chk{padding:8px 0;border-bottom:1px solid var(--line)}
.chk:last-child{border:0}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.ev{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.ev button{min-height:32px;padding:0 10px;background:transparent;color:var(--bad)}
.sub{font-size:13px;color:var(--mute)}
.sr{position:absolute;left:-9999px}
.sus{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-radius:8px;margin-top:6px;color:#fff;font-weight:600}
.sus b{font:700 30px 'Barlow Condensed',sans-serif;font-variant-numeric:tabular-nums}
.sus.gr{background:#1d7a4d}.sus.ye{background:#946200}.sus.rd{background:#c23030}
.ep{padding:8px}.ep .tn{display:block;text-align:center;font:700 20px 'Barlow Condensed',sans-serif}.ep input{margin:6px 0;text-align:center}
.eb{width:100%;min-height:52px;margin-top:6px;font-size:15px;color:#fff;padding:0 6px}
.eb.gl{background:var(--pri);border:1px solid var(--line)}.eb.cv{background:#1d7a4d}.eb.cy{background:#e0a800;color:#12262d}.eb.cr{background:#c23030}
.toast{margin:8px 0;padding:10px 12px;border-radius:8px;background:var(--card);border:1px solid var(--ok);font-weight:600;text-align:center}
.toast:empty{display:none}
.abg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}
.ab{min-height:88px;padding:4px;font:700 15px/1.1 'Barlow Condensed',sans-serif;color:#4a1244;text-transform:uppercase;border-radius:6px}
.ab i{display:block;width:22px;height:30px;border-radius:4px;border:3px solid #4a1244;margin:0 auto 4px}
.sheet{position:fixed;left:0;right:0;bottom:calc(56px + env(safe-area-inset-bottom,0px));max-height:62vh;overflow:auto;background:var(--card);border-top:3px solid var(--acc);padding:10px 12px;z-index:20}
.sheet .sh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.pb{width:100%;margin-top:6px;text-align:left;padding:0 10px}
.pb small{opacity:.75;font-weight:400}
.sheet .on{background:var(--ok)}
.tbl{overflow-x:auto}
.tbl table{width:100%;border-collapse:collapse;min-width:540px;font-size:14px}
.tbl th{font:600 12px Barlow,sans-serif;text-align:left;color:var(--mute);border-bottom:1px solid var(--line);padding:6px 4px;text-transform:uppercase}
.tbl td{padding:6px 4px;border-bottom:1px solid var(--line)}
.tbl button{min-height:36px;padding:0 10px;margin-left:4px}
.evr{padding:10px 0;border-bottom:1px solid var(--line)}.evr:last-child{border:0}
.evr.anul .t1{text-decoration:line-through;opacity:.55}
.evb{display:flex;gap:6px;margin-top:6px}.evb button{flex:1;min-height:40px;padding:0 8px}.evb .del{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.tbl tr.anul td:not(:last-child){text-decoration:line-through;opacity:.55}
.tbl button:not(.alt){background:transparent;color:var(--bad)}
.ev button.alt{color:var(--ink)}
</style>
</head>

<main id="app"></main>
<nav id="nav"></nav>
<script>
const TABS=[["m","Partido"],["c","Reloj"],["e","Equipos"],["r","Revisión"]];
const ROLES=["Entrenador","Delegado","Ayudante","Médico/Fisio","Otro"];
const EVT=["Gol","Tarjeta verde","Tarjeta amarilla","Tarjeta roja","Tiempo muerto"];
const mkTeam=n=>({nombre:n,club:"",staff:ROLES.map(r=>({rol:r,nombre:"",lic:""})),jug:Array.from({length:18},()=>({n:"",nombre:"",lic:"",c:false,p:false}))});
let S={m:{comp:"",fecha:new Date().toISOString().slice(0,10),hora:"",lugar:"",arb1:"",arb2:"",mesa:"",cuartos:4,min:15},t:[mkTeam("Local"),mkTeam("Visitante")],ev:[],ck:{q:1,rem:900000,run:false},obs:"",fl:"",fv:"",farb:""};
let tab="c",last=0;
try{const x=localStorage.getItem("acta2");if(x){S=JSON.parse(x);S.ck.run=false}}catch(e){}
const save=()=>{try{localStorage.setItem("acta2",JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=ms=>{ms=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(ms/60)).padStart(2,"0")+":"+String(ms%60).padStart(2,"0")};
const dur=()=>S.m.min*60000;
const goals=t=>S.ev.filter(e=>e.t===t&&e.tipo==="Gol"&&!e.anulado).length;
const gmin=()=>(S.ck.q-1)*S.m.min+Math.min(S.m.min,Math.floor((dur()-S.ck.rem)/60000)+1);
const stamp=()=>"C"+S.ck.q+" "+fmt(dur()-S.ck.rem)+" · min "+gmin()+"'";

function tick(){
  const now=Date.now();
  if(S.ck.run){
    S.ck.rem-=now-last;
    S.ev.forEach(e=>{if(e.sus>0&&!e.anulado){e.sus=Math.max(0,e.sus-(now-last));if(e.sus===0){try{navigator.vibrate&&navigator.vibrate(300)}catch(x){}}}});
    if(S.ck.rem<=0){S.ck.rem=0;S.ck.run=false;try{navigator.vibrate&&navigator.vibrate([400,150,400])}catch(e){}paintClock();render()}
  }
  last=now;
  if(tab==="c")paintClock();
}
function paintClock(){
  const c=$("#clk");if(!c)return;
  c.textContent=fmt(S.ck.rem);c.classList.toggle("end",S.ck.rem===0);
  const g=$("#go");g.textContent=S.ck.run?"PARAR":(S.ck.rem===0?"FIN DE CUARTO":"INICIAR");g.classList.toggle("run",S.ck.run);
  const sx=$("#sus");if(sx)sx.innerHTML=susHTML();
}
function toggle(){
  if(S.ck.rem===0)return;
  S.ck.run=!S.ck.run;last=Date.now();
  if(S.ck.run){try{navigator.wakeLock&&navigator.wakeLock.request("screen")}catch(e){}}
  paintClock();save();
}
function adj(ms){S.ck.rem=Math.min(dur(),Math.max(0,S.ck.rem+ms));paintClock();save()}
function nextQ(){
  if(S.ck.q>=S.m.cuartos)return;
  S.ck.q++;S.ck.rem=dur();S.ck.run=false;save();render();
}
function prevQ(){if(S.ck.q>1){S.ck.q--;S.ck.rem=dur();S.ck.run=false;save();render()}}
function applyCfg(){S.ck={q:1,rem:dur(),run:false};save()}

function field(l,p,type="text"){const v=p.split(".").reduce((o,k)=>o[k],S);return `<label>${l}<input type="${type}" data-p="${p}" value="${esc(v)}"></label>`}
function vMatch(){
  const out=[];
  S.t.forEach((t,i)=>{
    const ps=t.jug.filter(j=>j.n!==""||j.nombre.trim());
    const nums=ps.map(j=>j.n).filter(n=>n!=="");
    const dup=nums.filter((n,k)=>nums.indexOf(n)!==k);
    const nm=t.nombre||(i?"Visitante":"Local");
    out.push([ps.length>=11,`${nm}: ${ps.length} jugadores inscritos (mínimo 11)`]);
    out.push([ps.length<=18,`${nm}: no más de 18 jugadores`]);
    out.push([ps.every(j=>j.n!==""&&j.nombre.trim()),`${nm}: todos los jugadores con dorsal y nombre`]);
    out.push([!dup.length,dup.length?`${nm}: dorsal repetido (${[...new Set(dup)].join(", ")})`:`${nm}: sin dorsales repetidos`]);
    out.push([ps.filter(j=>j.x).length===11,`${nm}: 11 jugadores iniciales marcados`]);
    out.push([ps.filter(j=>j.c).length===1,`${nm}: un capitán marcado`]);
    out.push([ps.some(j=>j.p),`${nm}: portero marcado`]);
    out.push([t.staff[0].nombre.trim()!=="",`${nm}: entrenador indicado`]);
    out.push([(t.club||"").trim()!=="",`${nm}: club indicado`]);
    const bad=S.ev.filter(e=>!e.anulado&&e.t===i&&e.d!==""&&!nums.includes(String(e.d)));
    out.push([!bad.length,bad.length?`${nm}: eventos con dorsal que no está en el acta`:`${nm}: eventos con dorsales válidos`]);
  });
  const m=S.m;
  out.push([!S.ev.some(e=>!e.anulado&&e.tipo!=="Tiempo muerto"&&e.d===""),"Goles y tarjetas: todos con dorsal del jugador"]);
  out.push([m.fecha&&m.hora&&m.lugar&&m.comp,"Cabecera: competición, fecha, hora y lugar"]);
  out.push([m.arb1.trim()&&m.arb2.trim(),"Árbitros indicados"]);
  out.push([m.mesa.trim()!=="","Mesa / anotador indicado"]);
  out.push([S.ck.q===+m.cuartos&&S.ck.rem===0,"Partido terminado (último cuarto a 00:00)"]);
  out.push([S.fl.trim()&&S.fv.trim()&&S.farb.trim(),"Firmas: capitanes/delegados y árbitro"]);
  return out;
}

const V={
m(){return `<h2>Datos del partido</h2><div class="card">${field("Competición","m.comp")}${field("Jornada / fase","m.jornada")}<div class="g2">${field("Ciudad","m.ciudad")}${field("Nº de acta","m.nacta")}</div><div class="g2">${field("Fecha","m.fecha","date")}${field("Hora","m.hora","time")}</div>${field("Campo","m.lugar")}<div class="g2">${field("Árbitro 1","m.arb1")}${field("Árbitro 2","m.arb2")}</div>${field("Delegados técnicos","m.dt")}${field("Manager / analista","m.man")}${field("Mesa / anotador","m.mesa")}</div>
<h2>Tiempo</h2><div class="card"><div class="g2">${field("Nº de cuartos","m.cuartos","number")}${field("Minutos por cuarto","m.min","number")}</div><p class="sub">Al cambiar la duración, el reloj vuelve al cuarto 1.</p><button data-a="cfg" style="width:100%">Aplicar y reiniciar reloj</button></div>
<h2>Protesto del acta</h2><div class="card">${[0,1].map(i=>`<label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" style="width:auto;min-height:auto" data-p="t.${i}.prot" ${S.t[i].prot?"checked":""}> ${esc(S.t[i].nombre)}: protesto</label>`).join("")}</div>
<h2>Observaciones</h2><div class="card"><textarea rows="4" data-p="obs">${esc(S.obs)}</textarea></div>`},
c(){return `<div class="card"><div class="score"><div><b>${goals(0)}</b><br><span>${esc(S.t[0].nombre)}</span></div><span>-</span><div><b>${goals(1)}</b><br><span>${esc(S.t[1].nombre)}</span></div></div></div>
<div class="q">Cuarto ${S.ck.q} de ${S.m.cuartos}</div><div class="clock" id="clk" role="timer"></div><div id="sus"></div>
<button id="go" data-a="go"></button><div class="toast" id="ls" role="status">${esc(LM)}</div>${acPanel()}
<div class="g2"><button class="alt" data-a="a-60000">-1 min</button><button class="alt" data-a="a60000">+1 min</button><button class="alt" data-a="a-10000">-10 s</button><button class="alt" data-a="a10000">+10 s</button></div>
<div class="g2" style="margin-top:8px"><button class="alt" data-a="pq">Cuarto anterior</button><button data-a="nq" ${S.ck.q>=S.m.cuartos?"disabled style='opacity:.4'":""}>Siguiente cuarto</button></div><h2>Eventos del partido</h2><div class="card tbl" id="log">${tblHTML()}</div>`},
e(){return importBox()+S.t.map((t,i)=>`<h2>${i?"Visitante":"Local"}</h2><div class="card"><div class="g2">${field("Club",`t.${i}.club`)}${field("Equipo",`t.${i}.nombre`)}</div>
<label>Staff</label>${t.staff.map((s,k)=>`<div class="row staff"><span class="sub">${s.rol}</span><input placeholder="Nombre" data-p="t.${i}.staff.${k}.nombre" value="${esc(s.nombre)}"><input placeholder="Licencia" data-p="t.${i}.staff.${k}.lic" value="${esc(s.lic)}"></div>`).join("")}
<label>Jugadores</label><div class="row"><span class="t">Dorsal</span><span class="t">Nombre</span><span class="t">Licencia</span><span class="t">Ini</span><span class="t">C</span><span class="t">P</span></div>
${t.jug.map((j,k)=>`<div class="row"><input inputmode="numeric" data-p="t.${i}.jug.${k}.n" value="${esc(j.n)}" aria-label="Dorsal"><input data-p="t.${i}.jug.${k}.nombre" value="${esc(j.nombre)}" aria-label="Nombre"><input data-p="t.${i}.jug.${k}.lic" value="${esc(j.lic)}" aria-label="Licencia"><input type="checkbox" data-p="t.${i}.jug.${k}.x" ${j.x?"checked":""} aria-label="Inicio"><input type="checkbox" data-p="t.${i}.jug.${k}.c" ${j.c?"checked":""} aria-label="Capitán"><input type="checkbox" data-p="t.${i}.jug.${k}.p" ${j.p?"checked":""} aria-label="Portero"></div>`).join("")}
<p class="sub">Ini = titular, C = capitán, P = portero</p></div>`).join("")},
v(){return `<h2>Registrar evento</h2><div class="card"><div class="g2"><label>Equipo<select id="evt">${S.t.map((t,i)=>`<option value="${i}">${esc(t.nombre)}</option>`).join("")}</select></label><label>Evento<select id="evk">${EVT.map(x=>`<option>${x}</option>`).join("")}</select></label></div><label>Dorsal del autor (opcional en tiempo muerto)<input id="evd" inputmode="numeric"></label><div id="xg"><label>Tipo de jugada<select id="evj"><option>Jugada de campo</option><option>Penalty Corner</option><option>Penalty Stroke</option></select></label></div><div id="xy" hidden><label>Minutos de exclusión (mínimo 5)<input id="evm" type="number" min="5" value="5"></label></div><p class="sub" id="xn"></p><button data-a="addev" style="width:100%;margin-top:10px">Añadir a ${stamp()}</button></div>

const PROMPT=`Estas imágenes son un acta de partido de hockey. Extrae solo lo que se lea con claridad y no inventes nada. Responde únicamente con JSON, sin texto extra ni comillas de código, con esta forma: {"equipos":[{"club":"","nombre":"","staff":[{"rol":"Entrenador|Ayudante|Delegado|Médico/Fisio|Otro","nombre":"","licencia":""}],"jugadores":[{"dorsal":"","nombre":"","licencia":"","capitan":false,"portero":false,"inicio":false}]}],"partido":{"competicion":"","jornada":"","ciudad":"","nacta":"","fecha":"AAAA-MM-DD","hora":"HH:MM","lugar":"","arbitro1":"","arbitro2":"","delegadosTecnicos":"","manager":"","mesa":""}}. El primer equipo es el local y el segundo el visitante. En la columna Inicio, X es titular y XC titular y capitán; la columna P indica P (portero) o J (jugador). PR-ENTRENADOR es Entrenador y PR-DELEGADO EQUIPO es Delegado. La ciudad, el número de acta y la jornada salen de la cabecera. Ignora las páginas de información anexa. Deja "" lo que no aparezca.`;

async function leerActa(f){
  if(f.type==="application/pdf"&&window.pdfjsLib){
    try{
      say("Leyendo el PDF...");
      pdfjsLib.GlobalWorkerOptions.workerSrc="pdf.worker.min.js";
      const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;
      const pg=await pdf.getPage(1),tc=await pg.getTextContent(),vp=pg.getViewport({scale:1});
      const r=parseActa(tc.items.filter(i=>i.str.trim()).map(i=>({s:i.str.trim(),x:i.transform[4],y:i.transform[5],h:i.height})),vp.width);
      if(r.equipos.reduce((n,q)=>n+q.jugadores.length,0)>=5){aplicar(r);say("");return}
    }catch(e){}
  }
  try{
    const sample=window.claude?await window.claude.use("sample"):null;
    if(!sample){say("No reconocí el formato del acta. Usa el PDF oficial de la federación (no una foto).");return}
    say("Preparando las páginas...");
    let imgs=[];
    if(f.type==="application/pdf"){
      if(!window.pdfjsLib){say("No se pudo cargar el lector de PDF. Prueba con una foto del acta.");return}
      pdfjsLib.GlobalWorkerOptions.workerSrc="pdf.worker.min.js";
      const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;
      for(let p=1;p<=Math.min(pdf.numPages,3);p++){
        const pg=await pdf.getPage(p),vp=pg.getViewport({scale:1.6});
        const c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;
        await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
        imgs.push(await new Promise(r=>c.toBlob(r,"image/jpeg",.85)));
      }
    }else imgs=[f];
    say("Leyendo el acta con Claude, puede tardar un minuto...");
    aplicar(await sample.json(PROMPT,{images:imgs}));
  }catch(e){
    const c=e&&e.code;
    say(c==="not_granted"?"Has rechazado el permiso para usar Claude.":c==="vacio"?"No encontré jugadores ni staff en el documento.":"No se pudo leer el acta ("+(c||"error")+"). Prueba con otra foto.");
  }
}

function qTable(){

  return h+`<div class="ev"><span>Shoot-out</span><b>${so(0)} : ${so(1)}</b></div>`;

function parseActa(it,W){
  const N=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase();
  const near=(a,b,t)=>Math.abs(a-b)<=t;
  const ord=(a,b)=>Math.abs(a.y-b.y)>2?b.y-a.y:a.x-b.x;
  const cap=s=>s.toLowerCase().replace(/(^|\s)\S/g,m=>m.toUpperCase());
  const hd=it.filter(i=>i.s==="NOMBRE Y APELLIDOS").sort((a,b)=>a.x-b.x).slice(0,2);
  const eqY=Math.max(0,...it.filter(i=>/^EQUIPO (LOCAL|VISITANTE)$/.test(i.s)).map(i=>i.y));
  const arbY=Math.max(0,...it.filter(i=>N(i.s).startsWith("ARBITRO")&&i.x<60).map(i=>i.y));
  const equipos=hd.map(h=>{
    const nx=h.x,yTop=h.y;
    const P=it.find(i=>i.s==="P"&&near(i.y,yTop,6)&&i.x<nx&&nx-i.x<40);
    const px=P?P.x:nx-24,x0=px-30,x1=nx+120;
    const st=it.filter(i=>i.s==="STAFF").sort((a,b)=>Math.abs(a.x-(nx+50))-Math.abs(b.x-(nx+50)))[0];
    const stY=st?st.y:0;
    const rows=it.filter(i=>(i.s==="P"||i.s==="J")&&i.x>=px-3&&i.x<=px+8&&i.y<yTop-2&&i.y>stY).sort((a,b)=>b.y-a.y);
    const inName=i=>i.x>=nx-3&&i.x<nx+105&&i.y<yTop-2&&i.y>stY;
    const pl=rows.map(r=>({r,parts:[]}));
    it.filter(inName).sort(ord).forEach(i=>{
      let t=pl.find(p=>near(p.r.y,i.y,3));
      if(!t)t=pl.filter(p=>p.r.y>i.y&&p.r.y-i.y<12).sort((a,b)=>(a.r.y-i.y)-(b.r.y-i.y))[0];
      if(t)t.parts.push(i.s);
    });
    const jugadores=[];
    pl.forEach(p=>{
      const n=it.find(i=>/^\d{1,2}$/.test(i.s)&&i.x>px+8&&i.x<nx-3&&near(i.y,p.r.y,3));
      if(!n)return;
      const ini=N(it.filter(i=>i.x<px-3&&i.x>=px-30&&near(i.y,p.r.y,5)).sort((a,b)=>a.x-b.x).map(i=>i.s).join(""));
      jugadores.push({dorsal:n.s,nombre:p.parts.join(" ").replace(/\s*\([^)]*\)\s*/g," ").replace(/\s+/g," ").trim(),licencia:"",inicio:ini.includes("X"),capitan:ini.includes("C"),portero:p.r.s==="P"});
    });
    const stTxt=it.filter(i=>i.x>=x0&&i.x<x1&&i.y<stY-2&&i.y>arbY).sort(ord).map(i=>i.s).join(" ").replace(/\(F\)/g," ").replace(/\s+/g," ");
    const staff=[];
    stTxt.replace(/PR-([A-ZÁÉÍÓÚÑ ]+?):\s*(.*?)(?=\s*PR-[A-ZÁÉÍÓÚÑ ]+?:|$)/g,(m,a,b)=>{
      const k=N(a);
      const rol=k.includes("AYUD")?"Ayudante":k.includes("ENTRENADOR")?"Entrenador":k.includes("DELEGADO")?"Delegado":/MEDIC|FISIO/.test(k)?"Médico/Fisio":"Otro";
      if(b.trim())staff.push({rol,nombre:b.trim(),licencia:""});
    });
    const cab=it.filter(i=>i.x>=x0&&i.x<x1&&i.y<eqY-3&&i.y>yTop+10&&!/^\d+$/.test(i.s));
    const mh=Math.max(0,...cab.map(i=>i.h));
    const nombre=cab.filter(i=>i.h>=mh-0.5).sort(ord).map(i=>i.s).join(" ");
    const club=cab.filter(i=>i.h<mh-0.5).sort(ord).map(i=>i.s).join(" ");
    return {club,nombre,staff,jugadores};
  });
  const labs=it.filter(i=>["CIUDAD","CAMPO","FECHA","HORA","Nº ACTA"].includes(i.s));
  const v={};
  if(labs.length){
    const ly=labs[0].y;
    it.filter(i=>i.y<ly-2&&i.y>ly-40).sort(ord).forEach(i=>{
      const l=labs.slice().sort((a,b)=>Math.abs(a.x-i.x)-Math.abs(b.x-i.x))[0];
      v[l.s]=((v[l.s]||"")+" "+i.s).trim();
    });
    var fed=it.filter(i=>i.y>ly+8&&i.y<ly+90).sort(ord).map(i=>i.s);
  }
  const f=(v["FECHA"]||"").match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  const fl=fed||[];
  const arb=[],ex={};
  const lines={};
  it.filter(i=>i.y<200&&i.y>110&&i.x<230).forEach(i=>{(lines[Math.round(i.y/3)]=lines[Math.round(i.y/3)]||[]).push(i)});
  Object.keys(lines).sort((a,b)=>b-a).map(k=>lines[k]).forEach(l=>{
    const t=l.sort((a,b)=>a.x-b.x).map(i=>i.s).join(" ").replace(/\(F\)/g,"").replace(/\s+/g," ").trim();
    const m=t.match(/^([^:]+):\s*(.+)$/);if(!m)return;
    const k=N(m[1]);
    if(k.startsWith("ARBITRO"))arb.push(m[2]);
    else if(k.startsWith("DELEGADOS TEC"))ex.dt=m[2];
    else if(k.startsWith("MANAGER"))ex.man=m[2];
  });
  return {equipos,partido:{
    competicion:fl.length>=3?fl[1]:(fl[0]||""),jornada:fl.length>=3?fl[2]:(fl[1]||""),
    ciudad:cap(v["CIUDAD"]||""),nacta:v["Nº ACTA"]||"",
    fecha:f?f[3]+"-"+f[2].padStart(2,"0")+"-"+f[1].padStart(2,"0"):"",hora:v["HORA"]||"",
    lugar:v["CAMPO"]||"",arbitro1:arb[0]||"",arbitro2:arb[1]||"",
    delegadosTecnicos:ex.dt||"",manager:ex.man||"",mesa:""}};
}

function evPanel(){
  const b=(i,k,j,l,c)=>`<button class="eb ${c}" data-a="ev|${i}|${k}|${j}">${l}</button>`;
  return `<div class="g2">`+[0,1].map(i=>`<div class="card ep"><b class="tn">${esc(S.t[i].nombre)}</b><input id="d${i}" inputmode="numeric" placeholder="Dorsal" aria-label="Dorsal ${esc(S.t[i].nombre)}">${b(i,"Gol","Jugada de campo","Gol campo","gl")}${b(i,"Gol","Penalty Corner","Gol P. Corner","gl")}${b(i,"Gol","Penalty Stroke","Gol P. Stroke","gl")}${b(i,"Tarjeta verde","","Verde 2 min","cv")}${b(i,"Tarjeta amarilla","","Amarilla","cy")}${b(i,"Tarjeta roja","","Roja","cr")}</div>`).join("")+`</div><label>Minutos de la tarjeta amarilla (mínimo 5)<input type="number" min="5" data-p="ym" value="${esc(S.ym||5)}"></label>`;
}
function quick(i,k,j){
  const d=($("#d"+i)||{value:""}).value.trim();
  const ev={t:i,k,tipo:k,d,s:stamp()};
  if(k==="Gol")ev.j=j;
  if(k==="Tarjeta verde")ev.sus=ev.susT=120000;
  if(k==="Tarjeta amarilla"){const m=Math.max(5,+S.ym||5);ev.sus=ev.susT=m*60000}
  S.ev.push(ev);
  LM=(k==="Gol"?"Gol ("+j+")":k)+" · "+S.t[i].nombre+(d?" #"+d:"")+" · "+ev.s;
  try{navigator.vibrate&&navigator.vibrate(60)}catch(x){}
  save();render(true);
}
function logHTML(){
  if(!S.ev.length)return `<p class="sub">Los eventos que registres aparecerán aquí.</p>`;
  return S.ev.map((e,k)=>[e,k]).reverse().slice(0,6).map(([e,k])=>`<div class="ev"><span><b>${e.s}</b><br>${esc(e.k)}${e.j?" ("+esc(e.j)+")":""} · ${esc(S.t[e.t].nombre)}${e.d!==""?" #"+esc(e.d)+pn(e.t,e.d):" · sin dorsal"}</span><span><button class="alt" data-a="dor${k}">Dorsal</button><button data-a="del${k}">Borrar</button></span></div>`).join("");
}
function render(keep){
  $("#nav").innerHTML=TABS.map(([k,l])=>`<button data-tab="${k}" aria-current="${k===tab}">${l}</button>`).join("");
  $("#app").innerHTML=V[tab]();
  if(tab==="v")updEv();
  if(tab==="c")paintClock();
  if(!keep)window.scrollTo(0,0);
}
function setP(p,v){
  const ks=p.split(".");let o=S;
  ks.slice(0,-1).forEach(k=>o=o[k]);
  o[ks[ks.length-1]]=v;
}
document.addEventListener("input",e=>{
  const p=e.target.dataset.p;if(!p)return;
  let v=e.target.type==="checkbox"?e.target.checked:e.target.value;
  if(p==="m.cuartos"||p==="m.min")v=Math.max(1,+v||1);
  setP(p,v);save();
});
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab],[data-a]");if(!t)return;
  if(t.dataset.tab){tab=t.dataset.tab;render();return}
  const a=t.dataset.a;
  if(a==="go")toggle();
  else if(a==="cfg"){applyCfg();alert("Reloj reiniciado: "+S.m.cuartos+" cuartos de "+S.m.min+" min.")}
  else if(a==="nq")nextQ();
  else if(a==="pq")prevQ();
  else if(/^a-?\d/.test(a))adj(+a.slice(1));
  else if(a==="addev"){
    const d=$("#evd").value.trim();const k=$("#evk").value;
    if(d===""&&k!=="Tiempo muerto"){alert("Indica el dorsal.");return}
    const ev={t:+$("#evt").value,k,tipo:k,d,s:stamp()};
    if(k==="Gol")ev.j=$("#evj").value;
    if(k==="Tarjeta verde")ev.sus=ev.susT=120000;
    if(k==="Tarjeta amarilla"){const m=Math.max(5,+$("#evm").value||5);ev.sus=ev.susT=m*60000}
    S.ev.push(ev);save();render();
  }
  else if(a.startsWith("ev|")){const p=a.split("|");quick(+p[1],p[2],p[3])}
  else if(a.startsWith("ac|")){PA=+a.slice(3);PT=stamp();ED=null;render(true)}
  else if(a.startsWith("ed|")){ED=+a.slice(3);PA=null;render(true)}
  else if(a==="edx"){ED=null;render(true)}
  else if(a.startsWith("edt|")){S.ev[ED].t=+a.slice(4);save();render(true)}
  else if(a.startsWith("edd|")){S.ev[ED].d=a.slice(4);save();render(true)}
  else if(a==="acx"){PA=null;render(true)}
  else if(a==="ores1"||a==="ores0"){PR=a==="ores1";render(true)}
  else if(a.startsWith("pk|")){const p=a.split("|");commit(+p[1],p[2])}
  else if(a.startsWith("dor")){const k=+a.slice(3);const v=prompt("Dorsal del jugador",S.ev[k].d);if(v!==null){S.ev[k].d=v.trim();save();render(true)}}
  else if(/^an\d+$/.test(a)){const x=S.ev[+a.slice(2)];if(x&&(x.anulado||confirm("\u00bfAnular este evento? Dejar\u00e1 de contar, pero quedar\u00e1 en el acta tachado."))){x.anulado=!x.anulado;save();render(true)}}
  else if(a.startsWith("del")){if(confirm("¿Borrar este evento?")){S.ev.splice(+a.slice(3),1);ED=null;save();render(true)}}
  else if(a==="reset"&&confirm("¿Borrar toda el acta?")){localStorage.removeItem("acta2");location.reload()}
});
render();last=Date.now();setInterval(tick,100);
</script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});</script>
</body>
